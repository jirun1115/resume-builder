<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">
  <!-- 픽셀 아트: 베레모 디자이너 만두 (Pixel Beret Dumpling) -->
  <!-- 꼭지 머리 주름 -->
  <rect x="15" y="4" width="2" height="2" fill="#F6D776"/>
  <rect x="13" y="5" width="2" height="2" fill="#E5B942"/>
  <rect x="17" y="5" width="2" height="2" fill="#E5B942"/>

  <!-- 보라색 화가 베레모 모자 -->
  <rect x="16" y="2" width="2" height="2" fill="#6B21A8"/>
  <rect x="8" y="4" width="14" height="2" fill="#9333EA"/>
  <rect x="6" y="6" width="18" height="3" fill="#A855F7"/>
  <rect x="7" y="9" width="16" height="1" fill="#7E22CE"/>

  <!-- 만두 본체 -->
  <rect x="10" y="8" width="12" height="2" fill="#E5B942"/>
  <rect x="8" y="10" width="16" height="2" fill="#FDECA6"/>
  <rect x="7" y="12" width="18" height="8" fill="#FDECA6"/>
  <rect x="8" y="20" width="16" height="2" fill="#FDECA6"/>
  <rect x="10" y="22" width="12" height="2" fill="#E5B942"/>

  <!-- 빨간 픽셀 안경테 & 렌즈 -->
  <rect x="8" y="13" width="7" height="5" fill="#DC2626"/>
  <rect x="17" y="13" width="7" height="5" fill="#DC2626"/>
  <rect x="15" y="14" width="2" height="1" fill="#DC2626"/>
  <rect x="9" y="14" width="5" height="3" fill="#FFFFFF"/>
  <rect x="18" y="14" width="5" height="3" fill="#FFFFFF"/>

  <!-- 눈동자 -->
  <rect x="11" y="14" width="2" height="3" fill="#111111"/>
  <rect x="11" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="20" y="14" width="2" height="3" fill="#111111"/>
  <rect x="20" y="14" width="1" height="1" fill="#FFFFFF"/>

  <!-- 붓 쥐고 있기 -->
  <rect x="25" y="16" width="4" height="2" fill="#854D0E"/>
  <rect x="29" y="15" width="2" height="2" fill="#EC4899"/>

  <!-- 볼터치 & 입 -->
  <rect x="8" y="19" width="3" height="1" fill="#FF8A80"/>
  <rect x="21" y="19" width="3" height="1" fill="#FF8A80"/>
  <rect x="15" y="19" width="2" height="1" fill="#8D6E63"/>

  <!-- 몸통 & 발 -->
  <rect x="13" y="23" width="6" height="3" fill="#FDECA6"/>
  <rect x="12" y="26" width="3" height="2" fill="#E5B942"/>
  <rect x="17" y="26" width="3" height="2" fill="#E5B942"/>
</svg>
