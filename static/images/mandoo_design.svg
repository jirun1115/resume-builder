<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 몸통 (뽀얗고 노릇한 만두) -->
  <ellipse cx="50" cy="58" rx="36" ry="30" fill="#FFE599" stroke="#E6B800" stroke-width="3"/>
  
  <!-- 만두 꼭지 주름 (위쪽 3개 뿔) -->
  <circle cx="50" cy="27" r="6" fill="#FFE599" stroke="#E6B800" stroke-width="2.5"/>
  <circle cx="40" cy="30" r="5" fill="#FFE599" stroke="#E6B800" stroke-width="2.5"/>
  <circle cx="60" cy="30" r="5" fill="#FFE599" stroke="#E6B800" stroke-width="2.5"/>

  <!-- 디자이너 화가 베레모 (와인/자주색 빵모자) -->
  <path d="M 28 32 Q 55 10 78 28 Q 74 44 40 40 Z" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2.5"/>
  <circle cx="56" cy="18" r="3" fill="#6A1B9A"/>
  
  <!-- 눈썹 -->
  <circle cx="37" cy="46" r="2" fill="#5C3D00"/>
  <circle cx="63" cy="46" r="2" fill="#5C3D00"/>

  <!-- 감각적인 둥근 안경 (빨간테 안경) -->
  <circle cx="36" cy="56" r="10" fill="#FFFFFF" stroke="#E53935" stroke-width="3.5"/>
  <circle cx="64" cy="56" r="10" fill="#FFFFFF" stroke="#E53935" stroke-width="3.5"/>
  <line x1="46" y1="56" x2="54" y2="56" stroke="#E53935" stroke-width="3.5"/>
  
  <!-- 예술적인 반짝 눈 -->
  <circle cx="36" cy="56" r="4.5" fill="#111111"/>
  <circle cx="34" cy="54" r="1.5" fill="#FFFFFF"/>
  <circle cx="64" cy="56" r="4.5" fill="#111111"/>
  <circle cx="62" cy="54" r="1.5" fill="#FFFFFF"/>

  <!-- 발그레한 볼터치 -->
  <ellipse cx="24" cy="65" rx="4" ry="2.5" fill="#FF4081" opacity="0.8"/>
  <ellipse cx="76" cy="65" rx="4" ry="2.5" fill="#FF4081" opacity="0.8"/>

  <!-- 깜찍한 입 -->
  <path d="M 47 67 Q 50 71 53 67" fill="none" stroke="#5C3D00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 앙증맞은 붓 들고 있기 -->
  <line x1="72" y1="72" x2="84" y2="60" stroke="#795548" stroke-width="3" stroke-linecap="round"/>
  <polygon points="84,60 88,56 86,63" fill="#FF9800"/>

  <!-- 작은 발 두 개 -->
  <ellipse cx="42" cy="88" rx="5" ry="4" fill="#FFE599" stroke="#E6B800" stroke-width="2"/>
  <ellipse cx="58" cy="88" rx="5" ry="4" fill="#FFE599" stroke="#E6B800" stroke-width="2"/>
</svg>
